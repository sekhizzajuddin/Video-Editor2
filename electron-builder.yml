appId: com.procut.videoeditor
productName: ProCut Video Editor
directories:
  output: release
  buildResources: electron/resources
npmRebuild: false
nodeGypRebuild: false
files:
  - dist/**
  - electron/**
  - package.json
  - "!node_modules/**"
asar: true
win:
  target:
    - nsis
  artifactName: ProCut-Video-Editor-${version}-Setup.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ProCut Video Editor
extraMetadata:
  main: electron/main.cjs
